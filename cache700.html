<!DOCTYPE html>
<html lang="en" manifest="700.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAME SHOP · Offline Cache</title>
  <link rel="stylesheet" href="host.css">
</head>
<body>
<script>
if (window.applicationCache) {
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(e.total ? Math.round(e.loaded / e.total * 100) : 0);window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.onnoupdate=DisplayCacheProgress;
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
}
</script>
  <main class="host">
    <header class="host-header">
      <h1>GAME SHOP</h1>
      <p class="subtitle">PS4 GoldHEN Host</p>
      <span class="badge badge-orange">🎮 FW 7.00–8.52</span>
      <span class="badge badge-blue">🛡 Offline Cache</span>
    </header>
    <div class="banner">
      <img src="gameshop_still.jpg" data-animated="gameshop_animated.gif" width="960" height="536" alt="GAME SHOP">
    </div>
    <section class="progress-panel" aria-label="Offline cache installation">
      <div class="progress-heading">
        <div class="status" id="msgs" role="status">Starting offline cache installation…</div>
        <span class="percentage" id="progress-value" aria-hidden="true">0%</span>
      </div>
      <div class="progress-track" id="progress" role="progressbar" aria-label="Cache progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill"></div>
      </div>
    </section>
    <a class="cache-button" id="back-to-host" href="index.html" hidden>Back to Host</a>
    <footer><strong>GAME SHOP</strong> · Host files by GamerHack</footer>
  </main>
  <script src="ui.js"></script>
</body>
</html>
